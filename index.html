<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ProfitShare</title>
    <meta name="description" content="Free, open-source budgeting, scheduling and profit-share modelling for independent films. It runs in your browser, with no account, and your projects stay on your computer." />
    <meta name="theme-color" content="#092827" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <!-- What a link to the app looks like when it is pasted into a message or a post. The picture's address is given
         in full because the apps that draw the preview do not work it out from the page's own. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="ProfitShare" />
    <meta property="og:title" content="ProfitShare: film budgeting with a profit share built in" />
    <meta property="og:description" content="Free, open-source budgeting, scheduling and profit-share modelling for independent films. No account, and your projects stay on your computer." />
    <meta property="og:url" content="https://profitshare.alonegirlmovie.com/" />
    <meta property="og:image" content="https://profitshare.alonegirlmovie.com/social.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="The name ProfitShare typed in pale blue on dark green, over the line: Film budgeting with a profit share built in. Free and open source." />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="ProfitShare: film budgeting with a profit share built in" />
    <meta name="twitter:description" content="Free, open-source budgeting, scheduling and profit-share modelling for independent films. No account, and your projects stay on your computer." />
    <meta name="twitter:image" content="https://profitshare.alonegirlmovie.com/social.png" />
    <script>
      // apply the saved look before anything paints, so the page never flashes the other theme
      try { var t = localStorage.getItem('profitshare.theme'); if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t); } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
